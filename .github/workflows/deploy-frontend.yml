name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'serverless.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      
      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy infrastructure with serverless
        env:
          SERVERLESS_ACCESS_KEY:  ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx --yes serverless@4 deploy --stage prod

      - name: Sync dist to S3 and invalidate Cloudfront
        run: |
          STACK="holly-frontend-prod"
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          STORE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='StoreUrl'].OutputValue" --output text)
          aws s3 sync dist/ "s3://$BUCKET" --delete --exclude "*.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://$BUCKET" --exclude "*" --include "*.html" --cache-control "public, max-age=0, must-revalidate"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "Deployed to: $STORE_URL"